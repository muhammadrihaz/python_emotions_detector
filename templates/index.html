<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding: 50px; font-family: 'Inter', sans-serif; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .btn-analyze { background: #0d6efd; color: white; transition: 0.3s; }
        .btn-analyze:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-4">Emotion Detector AI</h1>
        <p class="text-muted">Analyze the emotion expressed in your text.</p>
        <div class="mb-3">
            <textarea id="textInput" class="form-control" rows="4" placeholder="Type something..."></textarea>
        </div>
        <button id="analyzeBtn" class="btn btn-analyze w-100 py-2">Analyze Emotion</button>
        
        <div id="result" class="result-box alert"></div>
    </div>

    <script>
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const text = document.getElementById('textInput').value;
            const resultBox = document.getElementById('result');
            
            if (!text.trim()) {
                resultBox.className = 'result-box alert alert-danger';
                resultBox.innerText = 'Invalid text! Please try again!';
                resultBox.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`/emotion?text=${encodeURIComponent(text)}`);
                const data = await response.json();

                if (response.status === 400) {
                    resultBox.className = 'result-box alert alert-danger';
                    resultBox.innerText = data.error || 'Invalid text! Please try again!';
                } else if (data.dominant_emotion) {
                    resultBox.className = 'result-box alert alert-success';
                    resultBox.innerText = `The system response is: 'anger': ${data.anger}, 'disgust': ${data.disgust}, 'fear': ${data.fear}, 'joy': ${data.joy} and 'sadness': ${data.sadness}. The dominant emotion is ${data.dominant_emotion}.`;
                } else {
                    resultBox.className = 'result-box alert alert-warning';
                    resultBox.innerText = 'Unexpected error occurred.';
                }
                resultBox.style.display = 'block';
            } catch (error) {
                resultBox.className = 'result-box alert alert-danger';
                resultBox.innerText = 'Error connecting to server.';
                resultBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
